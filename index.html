  <!-- Linked here rather than imported in main.jsx, so the static name below is styled from the
       first paint on the dev server too. -->
  <link rel="stylesheet" href="/src/index.css" />
  <script>
    // Decides before the first paint whether the loading intro plays, and starts loading the photo.
    // It plays on the first page of a visit and on a refresh, but not when coming back to the
    // home page from elsewhere during the same visit.
    (function () {
      var root = document.documentElement;
      var hasHash = location.hash && location.hash !== '#';
      var seen = null;
      try { seen = sessionStorage.getItem('intro-seen'); } catch (e) { /* Storage can be blocked. */ }
      var navigation = performance.getEntriesByType('navigation')[0];
      var reloaded = navigation && navigation.type === 'reload';
      var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var mode = location.pathname !== '/' || hasHash ? 'off' : calm || (seen && !reloaded) ? 'static' : 'play';
      root.dataset.intro = mode;
      if (mode === 'off') return;

      // A refresh starts over from the top. The story loads after the browser would restore the
      // scroll position, so restoring would stop short at a random spot anyway.
      if (mode === 'play' && reloaded) history.scrollRestoration = 'manual';

      // Same sources as the photo in Hero.jsx, so it comes straight from the cache there.
      var photo = new Image();
      photo.fetchPriority = 'high';
      photo.sizes = '(min-width: 1024px) 78vh, 115vw';
      photo.srcset = '/assets/images/profilebaru-cutout-800.webp 800w, /assets/images/profilebaru-cutout-1280.webp 1280w';
      window.__introPhoto = photo;
    })();
  </script>

<body>
  <!-- Loading line. It moves as the font, the photo, and the app code finish loading. -->
  <div aria-hidden="true"
    class="fixed inset-x-0 bottom-0 z-[120] h-1 origin-left bg-ink opacity-0 intro-play:opacity-100 scale-x-[var(--intro-progress,0)] transition-[scale,opacity] duration-300">
  </div>

  <!-- Shown until the app loads, then replaced by Hero.jsx. These classes must match the section
       and h1 there, or the name jumps when React takes over. -->
  <div id="root">
    <section
      class="@container sticky top-0 z-0 h-svh overflow-hidden bg-beton text-ink intro-off:hidden [--name:min(calc((100cqw_-_2.5rem)/2.666),17svh)] lg:[--name:min(calc((100cqw_-_3.5rem)/4.362),34svh)]">
      <h1
        class="absolute z-[1] inset-x-0 top-[5.75rem] lg:top-[4.5rem] text-center font-display font-normal uppercase leading-[0.98] lg:whitespace-nowrap text-[length:var(--name)] will-change-transform">
        <span class="block lg:inline">Moch</span>
        <span class="block lg:inline">Dapa</span>
        <span class="block">Adhari</span>
      </h1>
    </section>
  </div>

  <script>
    // Tracks real loading for the line above. This runs after the stylesheet, so the font is known.
    (function () {
      var root = document.documentElement;
      if (root.dataset.intro !== 'play') return;

      var done = 0;
      var step = function () {
        done += 1;
        root.style.setProperty('--intro-progress', Math.min(done / 3, 1));
      };
      var photo = window.__introPhoto;

      // useIntro.js calls this for the third step, once the app code is running.
      window.__introStep = step;
      window.__introReady = Promise.all([
        document.fonts.load('400 100px Anton').then(step, step),
        new Promise(function (resolve) {
          if (photo.complete) resolve();
          else photo.onload = photo.onerror = resolve;
        }).then(step),
      ]);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
